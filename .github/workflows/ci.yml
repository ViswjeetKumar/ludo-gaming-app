name: CI
on: [pull_request]
permissions: {contents: read}
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d6b6e5e8a0e1c7a7b8d09e4f5d6
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d6b6e5e8a0e1c7a7b8d09e4f5d6
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d6b6e5e8a0e1c7a7b8d09e4f5d6
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d6b6e5e8a0e1c7a7b8d09e4f5d6
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: "! git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN .*PRIVATE KEY-----)'"
